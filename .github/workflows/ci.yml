name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify frontend formatting, linting, and build
        run: npm run check
      - name: Audit production frontend dependencies
        run: npm run audit

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libayatana-appindicator3-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - name: Verify Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Check Rust compilation
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  sqlcipher-windows:
    name: SQLCipher Windows smoke tests
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install SQLCipher native build prerequisite
        shell: pwsh
        run: |
          choco install strawberryperl --yes --no-progress
          "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1
      - name: Build and test bundled SQLCipher
        run: cargo test --manifest-path src-tauri/Cargo.toml

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4

  rust-advisories:
    name: Rust advisory audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.23.0 --locked
      - name: Check Rust advisories
        run: cargo audit --file src-tauri/Cargo.lock
